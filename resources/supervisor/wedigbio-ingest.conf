[program:wedigbio-ingest]
directory={{APP_CURRENT_PATH}}
command=/usr/bin/php artisan queue:work beanstalkd --queue=wedigbio-ingest --sleep=3 --tries=3 --timeout=120 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=60
stopasgroup=true
killasgroup=true
user=ubuntu

redirect_stderr=true

; === Better logging setup ===
; Supervisor creates this file as root, so keep it out of shared storage: the deploy chmods storage as ubuntu
stdout_logfile=/var/log/supervisor/wedigbio-reports/wedigbio-ingest.log
stdout_logfile_maxbytes=50MB          ; 50MB log size before rotation
stdout_logfile_backups=10             ; Keep 10 rotated logs

environment=APP_ENV="{{APP_ENV}}"

